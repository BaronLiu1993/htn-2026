apply_library_patches: true
base_image:
  docker_auth: null
  image: vllm/vllm-openai:v0.22.0
  python_executable_path: ''
bdn:
  access: []
  hotload:
    enabled: false
  mounts: []
bis_llm: null
build:
  arguments: {}
  model_server: TrussServer
  no_cache: false
  secret_to_path_mapping: {}
build_commands: []
bundled_packages_dir: packages
cache_internal: []
data_dir: data
description: null
docker_server:
  liveness_endpoint: /health
  no_build: null
  predict_endpoint: /v1/chat/completions
  readiness_endpoint: /health
  run_as_user_id: null
  server_port: 8000
  start_command: '%(ENV_BT_DOCKER_SERVER_START_CMD)s'
environment_variables:
  BT_DOCKER_SERVER_START_CMD: sh -c "export HF_TOKEN=$(cat /secrets/hf_access_token);
    if [ -f /app/models/Qwen/Qwen3-8B/chat_template.jinja ]; then   vllm serve /app/models/Qwen/Qwen3-8B
    --served-model-name baseten-model --chat-template /app/models/Qwen/Qwen3-8B/chat_template.jinja   --port
    8000 --tensor-parallel-size 1 --max-num-seqs 256 --dtype bfloat16 --enable-lora
    --enable-mixed-moe-lora-format --max-lora-rank 16 --lora-modules .=/tmp/training_checkpoints/qe6pl23/rank-0/.
    --enable-auto-tool-choice --tool-call-parser hermes --reasoning-parser qwen3;
    else   vllm serve /app/models/Qwen/Qwen3-8B --served-model-name baseten-model
    --port 8000 --tensor-parallel-size 1 --max-num-seqs 256 --dtype bfloat16 --enable-lora
    --enable-mixed-moe-lora-format --max-lora-rank 16 --lora-modules .=/tmp/training_checkpoints/qe6pl23/rank-0/.
    --enable-auto-tool-choice --tool-call-parser hermes --reasoning-parser qwen3;
    fi"
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  VLLM_LOGGING_LEVEL: WARNING
examples_filename: examples.yaml
external_data: null
external_package_dirs: []
input_type: Any
live_reload: false
model_cache: []
model_class_filename: model.py
model_class_name: Model
model_framework: custom
model_metadata: {}
model_module_dir: model
model_name: Underwriter-Qwen3-8B
model_type: Model
python_version: py39
requirements: []
requirements_file: null
resources:
  accelerator: H100
  cpu: '1'
  memory: 2Gi
  node_count: 1
  use_gpu: true
runtime:
  egress_restrictions: null
  enable_debug_logs: false
  enable_tracing_data: false
  health_checks:
    restart_check_delay_seconds: null
    restart_threshold_seconds: null
    startup_threshold_seconds: null
    stop_traffic_threshold_seconds: null
  is_websocket_endpoint: false
  oidc:
    enabled: null
  predict_concurrency: 256
  remote_ssh:
    enabled: false
  streaming_read_timeout: 60
  transport:
    kind: http
  truss_server_version_override: null
secrets:
  hf_access_token: set token in baseten workspace
spec_version: '2.0'
system_packages: []
training_checkpoints:
  artifact_references:
  - paths:
    - rank-0/./
    training_job_id: qe6pl23
  download_folder: /tmp/training_checkpoints
  loops_checkpoint_ids: []
trt_llm: null
use_local_src: false
weights:
- allow_patterns: null
  auth: null
  auth_secret_name: hf_access_token
  ignore_patterns: null
  mount_location: /app/models/Qwen/Qwen3-8B
  source: hf://Qwen/Qwen3-8B
